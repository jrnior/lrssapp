<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Como você está, Larissa?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#2a1055;--bg2:#3a1873;--ink:#170633;--paper:#efe6ff;--feliz:#ffd23f;--normal:#c9a6ff;--triste:#7f8cff}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Baloo 2","Trebuchet MS",sans-serif;color:var(--ink);background:var(--bg);
  background-image:radial-gradient(var(--bg2) 2px,transparent 2px);background-size:26px 26px;animation:drift 5s linear infinite;
  display:flex;align-items:center;justify-content:center;padding:20px}
main{width:100%;max-width:640px}
.card{background:var(--paper);border:4px solid var(--ink);border-radius:6px;box-shadow:8px 8px 0 var(--ink);overflow:hidden}
.top{background:var(--ink);color:var(--paper);padding:10px 20px;font-weight:700;font-size:1.05rem}
h1{font-size:clamp(1.9rem,6.5vw,2.8rem);line-height:1.05;font-weight:800;padding:26px 20px 22px}
.sub{padding:0 20px 20px;font-weight:500;font-size:1.1rem}
.opts{display:grid;gap:12px;padding:0 20px 24px}
button{font:inherit;font-weight:800;font-size:1.6rem;text-align:left;color:var(--ink);cursor:pointer;
  padding:12px 18px;border:4px solid var(--ink);border-radius:6px;box-shadow:5px 5px 0 var(--ink);
  transition:transform .08s,box-shadow .08s}
button:hover{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
button:active{transform:translate(5px,5px);box-shadow:0 0 0 var(--ink)}
button:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
button[data-m=feliz]{background:var(--feliz)}
button[data-m=normal]{background:var(--normal)}
button[data-m=triste]{background:var(--triste)}
.result{display:none;padding:26px 20px 28px}
.result p{font-weight:500;font-size:1.15rem}
.result h2{font-size:clamp(1.6rem,5.5vw,2.3rem);line-height:1.1;font-weight:800;margin:6px 0 16px}
.result a{display:inline-block;font-weight:800;font-size:1.2rem;color:var(--ink);background:var(--feliz);
  border:4px solid var(--ink);border-radius:6px;box-shadow:5px 5px 0 var(--ink);padding:8px 16px;text-decoration:none}
.actions{display:flex;flex-wrap:wrap;gap:12px}
.again{font-size:1.2rem;padding:8px 16px;background:var(--normal)}
@keyframes drift{to{background-position:26px 0}}
@media (prefers-reduced-motion:reduce){button{transition:none}body{animation:none}}
</style>
</head>
<body>
<main>
  <div class="card">
    <section id="quiz">
      <h1>Como você está se sentindo hoje, Larissa?</h1>
      <div class="opts">
        <button data-m="feliz">Feliz</button>
        <button data-m="normal">Normal</button>
        <button data-m="triste">Triste</button>
      </div>
    </section>
    <section class="result" id="result" aria-live="polite">
      <p id="msg"></p>
      <h2 id="song"></h2>
      <div class="actions">
        <a id="go" href="#" target="_blank" rel="noopener">Abrir no Spotify</a>
        <button type="button" id="again" class="again">Tentar outra vez</button>
      </div>
    </section>
  </div>
</main>

const pool={};
for(const m in D){pool[m]=[];for(const a in D[m])D[m][a].split(";").forEach(t=>pool[m].push({a,t}))}

const msgs={feliz:"Que bom! Essa é pra continuar assim:",normal:"Um dia comum merece uma boa trilha:",triste:"Tudo bem. Essa é pra te fazer companhia:"};

document.querySelectorAll("button[data-m]").forEach(b=>b.addEventListener("click",()=>{
  const list=pool[b.dataset.m];
  const s=list[Math.floor(Math.random()*list.length)];
  const url="https://open.spotify.com/search/"+encodeURIComponent(s.a+" "+s.t);
  document.getElementById("quiz").style.display="none";
  const r=document.getElementById("result");r.style.display="block";
  document.getElementById("msg").textContent=msgs[b.dataset.m];
  document.getElementById("song").textContent=s.a+" - "+s.t;
  document.getElementById("go").href=url;
}));
document.getElementById("again").addEventListener("click",()=>{
  document.getElementById("result").style.display="none";
  document.getElementById("quiz").style.display="block";
});
</script>
</body>
</html>
